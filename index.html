<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Dollhouse</title>
        <style>
            body { margin: 0; }
            #container { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden }
            #three, #ui, #ghostui { position:absolute; top:0; left:0; width:100%; height:100% }
            #buttonHolder { pointer-events:none; display:flex; position:fixed; inset:0; width:auto; height:auto; align-items:end; justify-content:space-between; padding:1vw }
            .button { pointer-events:auto; user-select:none; width:20vw; align-items:center; justify-content:center;
                height:20vw; max-width:20vh; max-height:20vh; background-color:rgba(100,100,100,0.5);
                border-style:solid; border-radius:10%; border-width:10%; border-color:black; 
                font-size:5cqw; font-family:monospace; color:rgb(220,220,220); outline-width:10%; outline-color:white; }
            .pressed { background-color:rgba(200,200,200,0.5) }
            .mobileOnly { display:none }
            @media(max-width: 1024px) { .mobileOnly { display:flex; } }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                    "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
                    "trystero": "https://esm.run/trystero"
                }
            }
        </script>
    </head>
    <body style="background-color: black;">
        <div id="container">
            <canvas id="three" touch-action="none"></canvas>
            <canvas id="ghostui" touch-action="none"></canvas>
            <canvas id="ui" touch-action="none"></canvas>

            <div id="buttonHolder">
                <div class="mobileOnly button" ontouchstart="startTouch(event, 'e')" ontouchend="stopTouch(event, 'e')" ontouchcancel="stopTouch(event, 'e')">PLACE</div>
                <div class="mobileOnly button" ontouchstart="startTouch(event, 'q')" ontouchend="stopTouch(event, 'q')" ontouchcancel="stopTouch(event, 'q')">POSE</div>
                <div class="mobileOnly button" ontouchstart="startTouch(event, ' ')" ontouchend="stopTouch(event, ' ')" ontouchcancel="stopTouch(event, ' ')">UP</div>
            </div>
        </div>
        <script type="module" src="game.js"></script>
    </body>
    <script>
        function startTouch(event, key)
        {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.add("pressed");
            window.dispatchEvent(new KeyboardEvent("keydown", { key: key } ));
        }
        function stopTouch(event, key)
        {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.remove("pressed");
            window.dispatchEvent(new KeyboardEvent("keyup", { key: key } ));
        }
    </script>
</html>
