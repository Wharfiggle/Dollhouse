<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Dollhouse</title>
        <style>
            :root { 
                --buttonMargin: 0.5rem;
                --buttonSize: min(5rem, calc(33dvw - 6 * var(--buttonMargin))); 
                --boxSize: min(65dvw, calc(100dvh - var(--buttonSize) - var(--buttonMargin)));
            }
            * { box-sizing: border-box; }
            
            body { margin:0; background-color:black; }
            #container { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden }
            #three, #ui, #ghostui { position:fixed; inset:0; width:100%; height:100% }
            
            #overlay { pointer-events:none; display:flex; flex:1; position:fixed; inset:0; width:auto; height:auto; flex-direction:column; justify-content:end; }
            #menuHolder { display:none; flex:1; width:65dvw; height:auto; justify-content:center; align-items:center; }
            #menuBox { container-type:size; overflow:hidden; pointer-events:auto; display:flex; width:var(--boxSize); height:var(--boxSize); gap:2dvh;
                background-color:rgba(100,100,100,0.9); border-radius:5%; padding:2dvh; }
            
            #pivotSelect { position:relative; }
            #dollImg { height:100%; }
            #pivotSelect input { appearance:none; margin:0; position:absolute; cursor:pointer; width:11.5cqh; height:11.5cqh; 
                border-radius:100%; background-color:white; border:solid 1.5cqh black; -webkit-tap-highlight-color:transparent;
                background-repeat:no-repeat; background-position:center; background-image:radial-gradient(black 40%, white 45%);
                background-size:0% 0%; transition:background-size 0.35s cubic-bezier(0.05, 0.9, 0.2, 1); }
            #pivotSelect input:active { transform:scale(90%, 90%); transition:transform 0.5s ease }
            #pivotSelect input:checked { background-size:100% 100%; }
            #head { left:37.75%; top:5.5%; }
            #leftArm { left:1%; top:14.5% }
            #rightArm { right:1%; top:14.5%; }
            #leftLeg { left:21.5%; bottom:39.5%; }
            #rightLeg { right:21.5%; bottom:39.5%; }
            #torso { left:37.75%; top:28%; }
            
            #rightHolder { display:flex; flex:1; justify-content:center; align-items:space-between; flex-direction:column; }
            #colorPickerHolder { display:flex; flex:1; justify-content:center; align-items:center; }
            #colorPicker { margin-top:0; border:solid 0.75rem blue; border-radius:25%; width:20cqh; height:20cqh; }
            #arrowHolder { position:relative; width:50cqh; height:50cqh; }
            .arrowButton { position:absolute; cursor:pointer; top:50%; left:50%; width:15cqh; height:15cqh; 
                --scale:1; --scalex:1; transform:translate(-50%, -50%) rotate(var(--rotation)) scale(calc(var(--scale) * var(--scalex)), var(--scale)); transition:transform 0.1s ease}
            .arrowButton.side { width:12cqh; height:12cqh }
            .arrowButton:active { --scale:0.9 }
            #up { --rotation:0; top:17%; }
            #down { --rotation:180deg; top:83%; }
            #left { --rotation:270deg; left:17%; }
            #right { --rotation:90deg; left:83%; }
            #cw1 { --rotation:0; left:20%; top:20%; }
            #cw2 { --rotation:180deg; left:80%; top:80%; }
            #ccw1 { --scalex:-100%; --rotation:0; left:80%; top:20%; }
            #ccw2 { --scalex:-100%; --rotation:180deg; left:20%; top:80%; }

            #touchButtonHolder { display:flex; width:auto; align-items:end; justify-content:space-between; }
            .touchButton { container-type:inline-size; touch-action:none; pointer-events:auto; user-select:none; align-items:center; justify-content:center;
                width:var(--buttonSize); height:var(--buttonSize); margin-bottom:var(--buttonMargin); margin-left:var(--buttonMargin); margin-right:var(--buttonMargin); transition:transform 0.1s ease-out;
                background-color:rgb(80,80,80); border-radius:20%; border:0.25rem solid rgb(20,20,20); opacity:0.5; }
            h1 { font-size:30cqw; font-family:monospace; color:rgb(200,200,200); }
            .touchButton.pressed { opacity:0.75; transform:scale(0.9); transition:opacity 0.1s ease, transform 0.1s ease; }
            .mobileOnly { display:none }
            
            .fullscreenButton { border:none; position:fixed; cursor:pointer; inset:0; top:1rem; left:1rem; width:2.5rem; height:2.5rem; 
                opacity:0.5; background-color:rgb(80,80,80); padding:0.5rem; border-radius:0.3rem; }
            .fullscreenButton:active { opacity:0.75; padding:0.35rem; transition:opacity 0.1s ease, padding 0.1s ease }
            .fullscreenButton.fullscreenOnly:active { padding:0.75rem }
            .fullscreenOnly { display:none }
            .smallscreenOnly { display:flex }
            @media (display-mode: fullscreen) {
                .fullscreenOnly { display:flex }
                .smallscreenOnly { display:none }
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                    "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
                    "trystero": "https://esm.run/trystero"
                }
            }
        </script>
    </head>
    <body>
        <div id="container">
            <canvas id="three" touch-action="none"></canvas>
            <canvas id="ghostui" touch-action="none"></canvas>
            <canvas id="ui" touch-action="none" oncontextmenu="return false;"></canvas>

            <div id="overlay">
                <div id="menuHolder">
                    <div id="menuBox">
                        <div id="pivotSelect">
                            <img id="dollImg" src="./assets/DollHousePegManUI.png" draggable="false" oncontextmenu="return false;">
                            <input type="radio" name="pivot" id="head" value="head" oncontextmenu="return false;" checked="true">
                            <input type="radio" name="pivot" id="leftArm" value="leftArm" oncontextmenu="return false;">
                            <input type="radio" name="pivot" id="rightArm" value="rightArm" oncontextmenu="return false;">
                            <input type="radio" name="pivot" id="leftLeg" value="leftLeg" oncontextmenu="return false;">
                            <input type="radio" name="pivot" id="rightLeg" value="rightLeg" oncontextmenu="return false;">
                            <input type="radio" name="pivot" id="torso" value="torso" oncontextmenu="return false;">
                        </div>
                        <div id="rightHolder">
                            <div id="colorPickerHolder">
                                <input id="colorPicker" type="color">
                            </div>
                            <div id="arrowHolder">
                                <img class="arrowButton" id="up" src="./assets/arrowaway.png" draggable="false" oncontextmenu="return false;">
                                <img class="arrowButton" id="down" src="./assets/arrowaway.png" draggable="false" oncontextmenu="return false;">
                                <img class="arrowButton" id="right" src="./assets/arrowaway.png" draggable="false" oncontextmenu="return false;">
                                <img class="arrowButton" id="left" src="./assets/arrowaway.png" draggable="false" oncontextmenu="return false;">
                                <img class="arrowButton side" id="cw1" src="./assets/arrowside.png" draggable="false" oncontextmenu="return false;">
                                <img class="arrowButton side" id="cw2" src="./assets/arrowside.png" draggable="false" oncontextmenu="return false;">
                                <img class="arrowButton side" id="ccw1" src="./assets/arrowside.png" draggable="false" oncontextmenu="return false;">
                                <img class="arrowButton side" id="ccw2" src="./assets/arrowside.png" draggable="false" oncontextmenu="return false;">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mobileOnly" id="touchButtonHolder">
                    <div class="mobileOnly touchButton" ontouchstart="startTouch(event, 'e')" ontouchend="stopTouch(event, 'e')" ontouchcancel="stopTouch(event, 'e')"><h1>PLACE</h1></div>
                    <div class="mobileOnly touchButton" ontouchstart="startTouch(event, 'q')" ontouchend="stopTouch(event, 'q')" ontouchcancel="stopTouch(event, 'q')"><h1>POSE</h1></div>
                    <div class="mobileOnly touchButton" ontouchstart="startTouch(event, ' ')" ontouchend="stopTouch(event, ' ')" ontouchcancel="stopTouch(event, ' ')"><h1>UP</h1></div>
                </div>
            </div>
            <div class="mobileOnly smallscreenOnly fullscreenButton" oncontextmenu="return false;" onclick="fullscreen(event)">
                <img src="./assets/fullscreen.png" draggable="false" oncontextmenu="return false;">
            </div>
            <div class="mobileOnly fullscreenOnly fullscreenButton" oncontextmenu="return false;" onclick="smallscreen(event)">
                <img src="./assets/smallscreen.png" draggable="false" oncontextmenu="return false;">
            </div>
        </div>
        <script type="module" src="game.js"></script>
    </body>
    <script>
        const rules = [...document.styleSheets[0].cssRules];
        const mobileOnlyRule = rules.find(r => r.selectorText == ".mobileOnly");
        if(window.innerWidth <= 1024) //assume mobile, start mobileOnly class as visible by default
            mobileOnlyRule.style.display = "flex";

        const container = document.getElementById("container");
        const fullscreenOnlyRule = rules.find(r => r.selectorText == ".fullscreenOnly");
        const smallscreenOnlyRule = rules.find(r => r.selectorText == ".smallscreenOnly");

        window.addEventListener("keydown", (event) => { mobileOnlyRule.style.display = "none"; });
        window.addEventListener("touchstart", (event) => { mobileOnlyRule.style.display = "flex"; });

        function startTouch(event, key)
        {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.add("pressed");
            window.dispatchEvent(new KeyboardEvent("simkeydown", { key: key } ));
        }
        function stopTouch(event, key)
        {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.remove("pressed");
            window.dispatchEvent(new KeyboardEvent("simkeyup", { key: key } ));
        }

        function fullscreen(event)
        {
            event.preventDefault();
            container.requestFullscreen();
        }
        function smallscreen(event)
        {
            event.preventDefault();
            document.exitFullscreen();
        }
    </script>
</html>
