<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Dollhouse</title>
        <style>
            :root { 
                --buttonSize: max(8dvw, 18dvh); 
                --buttonSizeAndMargin: calc(var(--buttonSize) + 2dvh);
                --boxSize: min(65dvw, calc(98dvh - var(--buttonSizeAndMargin)));
            }
            * { box-sizing: border-box; }
            body { margin: 0; }
            #container { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden }
            #three, #ui, #ghostui { position:fixed; inset:0; width:100%; height:100% }
            #overlay { pointer-events:none; display:flex; flex:1; position:fixed; inset:0; width:auto; height:auto; flex-direction:column; justify-content:end; }
            #menuHolder { display:none; flex:1; width:65dvw; height:auto; justify-content:center; align-items:center; padding-top:1dvh; padding-bottom:1dvh; }
            #menuBox { display:flex; width:var(--boxSize); height:var(--boxSize); background-color:rgba(100,100,100,0.9); border-radius:5%; padding:2dvh; }
            #menuMan { background-color:green; flex:1; }
            #touchButtonHolder { display:flex; width:auto; align-items:end; justify-content:space-between; }
            .touchButton { container-type:inline-size; touch-action:none; pointer-events:auto; user-select:none; align-items:center; justify-content:center;
                width:var(--buttonSize); height:var(--buttonSize); margin:1dvh; transition:transform 0.05s ease-out;
                background-color:rgb(80,80,80); border-style:solid; border-radius:20%; border-width:0.35rem; border-color:rgb(20,20,20); opacity:0.5; }
            h1 { font-size:30cqw; font-family:monospace; color:rgb(200,200,200); }
            .touchButton.pressed { opacity:0.75; transform:scale(0.9); transition:opacity 0.05s ease, transform 0.05s ease; }
            .mobileOnly { display:none }
            .fullscreenButton { border:none; position:fixed; inset:0; top:2rem; left:2rem; width:4rem; height:4rem; 
                opacity:0.5; background-color:rgb(80,80,80); padding:0.75rem; border-radius:0.5rem; }
            .fullscreenButton:active { opacity:0.75; padding:0.85rem; transition:opacity 0.05s ease, padding 0.05s ease }
            .fullscreenOnly { display:none }
            .smallscreenOnly { display:flex }
            @media (display-mode: fullscreen) {
                .fullscreenOnly { display:flex }
                .smallscreenOnly { display:none }
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                    "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
                    "trystero": "https://esm.run/trystero"
                }
            }
        </script>
    </head>
    <body style="background-color: black;">
        <div id="container">
            <canvas id="three" touch-action="none"></canvas>
            <canvas id="ghostui" touch-action="none"></canvas>
            <canvas id="ui" touch-action="none"></canvas>

            <div id="overlay">
                <div id="menuHolder">
                    <div id="menuBox">
                        <div id="menuMan"></div>
                    </div>
                </div>
                <div class="mobileOnly" id="touchButtonHolder">
                    <div class="mobileOnly touchButton" ontouchstart="startTouch(event, 'e')" ontouchend="stopTouch(event, 'e')" ontouchcancel="stopTouch(event, 'e')"><h1>PLACE</h1></div>
                    <div class="mobileOnly touchButton" ontouchstart="startTouch(event, 'q')" ontouchend="stopTouch(event, 'q')" ontouchcancel="stopTouch(event, 'q')"><h1>POSE</h1></div>
                    <div class="mobileOnly touchButton" ontouchstart="startTouch(event, ' ')" ontouchend="stopTouch(event, ' ')" ontouchcancel="stopTouch(event, ' ')"><h1>UP</h1></div>
                </div>
            </div>
            <div class="mobileOnly smallscreenOnly fullscreenButton" onclick="fullscreen(event)"><img style="display:flex; flex:1" src="./fullscreen.png"></div>
            <div class="mobileOnly fullscreenOnly fullscreenButton" onclick="smallscreen(event)"><img src="./smallscreen.png"></div>
        </div>
        <script type="module" src="game.js"></script>
    </body>
    <script>
        const rules = [...document.styleSheets[0].cssRules];
        const mobileOnlyRule = rules.find(r => r.selectorText == ".mobileOnly");
        if(window.innerWidth <= 1024) //assume mobile, start mobileOnly class as visible by default
            mobileOnlyRule.style.display = "flex";

        const container = document.getElementById("container");
        const fullscreenOnlyRule = rules.find(r => r.selectorText == ".fullscreenOnly");
        const smallscreenOnlyRule = rules.find(r => r.selectorText == ".smallscreenOnly");

        window.addEventListener("keydown", (event) => { mobileOnlyRule.style.display = "none"; });
        window.addEventListener("touchstart", (event) => { mobileOnlyRule.style.display = "flex"; });

        function startTouch(event, key)
        {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.add("pressed");
            window.dispatchEvent(new KeyboardEvent("simkeydown", { key: key } ));
        }
        function stopTouch(event, key)
        {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.remove("pressed");
            window.dispatchEvent(new KeyboardEvent("simkeyup", { key: key } ));
        }

        function fullscreen(event) { container.requestFullscreen(); }
        function smallscreen(event) { document.exitFullscreen(); }
    </script>
</html>
